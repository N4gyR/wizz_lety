# Uloz do repozitara ako: .github/workflows/ceny.yml
name: Ceny Wizz

on:
  schedule:
    # GitHub pocita cas v UTC. 6,10,14,18 UTC = 7:17, 11:17, 15:17, 19:17 v SR (zimny cas, plati do 28.3.2027)
    - cron: "17 6,10,14,18 * * *"
  workflow_dispatch:          # tlacidlo "Run workflow" na rucne spustenie

permissions:
  contents: write             # aby mohol ulozit novy ceny_wizz.txt do repozitara

concurrency:
  group: ceny
  cancel-in-progress: false

jobs:
  zber:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Bratislava   # cas zberu v subore bude slovensky, nie UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zber cien
        run: python sleduj_ceny.py || true     # aj pri chybe ulozime riadok s CHYBA

      - name: Ulozenie do repozitara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceny_wizz.txt
          git diff --cached --quiet || git commit -m "Zber cien $(date '+%Y-%m-%d %H:%M')"
          git push
