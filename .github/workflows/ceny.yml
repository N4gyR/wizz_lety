# Uloz do repozitara ako: .github/workflows/ceny.yml
name: Ceny Wizz

on:
  schedule:
    # GitHub pocita cas v UTC. 1,7,14,19,22 UTC = 2:17, 8:17, 15:17, 20:17, 23:17 v SR (zimny cas, plati do 28.3.2027)
    - cron: "17 1,7,14,19,22 * * *"
  workflow_dispatch:          # tlacidlo "Run workflow" na rucne spustenie

permissions:
  contents: write             # aby mohol ulozit novy ceny_wizz.txt do repozitara
  pages: write                # zverejnenie stranky na GitHub Pages
  id-token: write

concurrency:
  group: ceny
  cancel-in-progress: false

jobs:
  zber:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.nasadenie.outputs.page_url }}
    env:
      TZ: Europe/Bratislava   # cas zberu v subore bude slovensky, nie UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # vzdy najnovsi stav repozitara (aj pri "Re-run")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zber cien
        run: python sleduj_ceny.py || true     # aj pri chybe ulozime riadok s CHYBA

      - name: Ulozenie do repozitara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceny_wizz.txt
          git diff --cached --quiet && exit 0
          git commit -m "Zber cien $(date '+%Y-%m-%d %H:%M')"
          # ak sa medzitym v repozitari nieco zmenilo, najprv to stiahni; 3 pokusy
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Stranka s vysledkami
        run: |
          python vyhodnot_ceny.py --neotvarat
          mkdir -p _site
          cp report_ceny.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: nasadenie
        uses: actions/deploy-pages@v5
